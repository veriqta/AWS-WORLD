<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">AWS World learning journey</title>
  <desc id="desc">Six-stage path from safe account setup to cloud foundations, building, architecture, operations, and specialization.</desc>
  <rect width="1080" height="1350" fill="#f7fafc"/>
  <text x="80" y="105" fill="#07182b" font-family="Arial, sans-serif" font-size="58" font-weight="700">THE AWS WORLD JOURNEY</text>
  <text x="82" y="158" fill="#49657c" font-family="Arial, sans-serif" font-size="27">Progress through evidence, not memorization</text>
  <path d="M180 255V1145" stroke="#b8cbd9" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <g><circle cx="180" cy="285" r="55" fill="#ff9900"/><text x="180" y="296" text-anchor="middle" font-size="34" font-weight="700" fill="#07182b">01</text><text x="285" y="275" font-size="40" font-weight="700" fill="#07182b">START SAFELY</text><text x="285" y="318" font-size="25" fill="#49657c">Account protection, MFA, budgets, CLI, cleanup</text></g>
    <g><circle cx="180" cy="465" r="55" fill="#2f86b7"/><text x="180" y="476" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">02</text><text x="285" y="455" font-size="40" font-weight="700" fill="#07182b">LEARN FOUNDATIONS</text><text x="285" y="498" font-size="25" fill="#49657c">Cloud, identity, networking, compute, storage, data</text></g>
    <g><circle cx="180" cy="645" r="55" fill="#2f86b7"/><text x="180" y="656" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">03</text><text x="285" y="635" font-size="40" font-weight="700" fill="#07182b">BUILD SYSTEMS</text><text x="285" y="678" font-size="25" fill="#49657c">Projects, IaC, automation, applications, tests</text></g>
    <g><circle cx="180" cy="825" r="55" fill="#2f86b7"/><text x="180" y="836" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">04</text><text x="285" y="815" font-size="40" font-weight="700" fill="#07182b">DESIGN ARCHITECTURE</text><text x="285" y="858" font-size="25" fill="#49657c">Requirements, trade-offs, security, reliability, cost</text></g>
    <g><circle cx="180" cy="1005" r="55" fill="#2f86b7"/><text x="180" y="1016" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">05</text><text x="285" y="995" font-size="40" font-weight="700" fill="#07182b">OPERATE AND RECOVER</text><text x="285" y="1038" font-size="25" fill="#49657c">Observability, incidents, runbooks, backup, game days</text></g>
    <g><circle cx="180" cy="1185" r="55" fill="#ff9900"/><text x="180" y="1196" text-anchor="middle" font-size="34" font-weight="700" fill="#07182b">06</text><text x="285" y="1175" font-size="40" font-weight="700" fill="#07182b">SPECIALIZE</text><text x="285" y="1218" font-size="25" fill="#49657c">Architecture, security, CloudOps, DevOps, data, AI, FinOps</text></g>
  </g>
  <rect x="78" y="1273" width="924" height="2" fill="#d1dfe9"/>
  <text x="540" y="1315" text-anchor="middle" fill="#49657c" font-family="Arial, sans-serif" font-size="24">Each stage ends with implementation, failure testing, verification, and cleanup</text>
</svg>
