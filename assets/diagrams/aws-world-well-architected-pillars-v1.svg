<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">AWS Well-Architected pillars</title>
  <desc id="desc">Six review cards for operational excellence, security, reliability, performance efficiency, cost optimization, and sustainability.</desc>
  <rect width="1080" height="1350" fill="#f7fafc"/>
  <text x="70" y="105" fill="#07182b" font-family="Arial, sans-serif" font-size="58" font-weight="700">REVIEW EVERY WORKLOAD</text>
  <text x="72" y="158" fill="#49657c" font-family="Arial, sans-serif" font-size="27">Six lenses for architecture decisions and continuous improvement</text>
  <g font-family="Arial, sans-serif">
    <g><rect x="70" y="235" width="440" height="280" rx="32" fill="#07182b"/><circle cx="145" cy="310" r="40" fill="#ff9900"/><text x="145" y="322" text-anchor="middle" font-size="31" font-weight="700" fill="#07182b">01</text><text x="205" y="305" font-size="34" font-weight="700" fill="#ffffff">OPERATIONAL</text><text x="205" y="345" font-size="34" font-weight="700" fill="#ffffff">EXCELLENCE</text><text x="110" y="415" font-size="24" fill="#c8d9e8">Operate, observe, change,</text><text x="110" y="451" font-size="24" fill="#c8d9e8">learn, and improve safely.</text></g>
    <g><rect x="570" y="235" width="440" height="280" rx="32" fill="#ffffff" stroke="#c8d9e8" stroke-width="3"/><circle cx="645" cy="310" r="40" fill="#2f86b7"/><text x="645" y="322" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">02</text><text x="705" y="326" font-size="36" font-weight="700" fill="#07182b">SECURITY</text><text x="610" y="415" font-size="24" fill="#49657c">Protect identity, data, systems,</text><text x="610" y="451" font-size="24" fill="#49657c">and detection capabilities.</text></g>
    <g><rect x="70" y="555" width="440" height="280" rx="32" fill="#ffffff" stroke="#c8d9e8" stroke-width="3"/><circle cx="145" cy="630" r="40" fill="#2f86b7"/><text x="145" y="642" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">03</text><text x="205" y="646" font-size="36" font-weight="700" fill="#07182b">RELIABILITY</text><text x="110" y="735" font-size="24" fill="#49657c">Withstand disruption, recover,</text><text x="110" y="771" font-size="24" fill="#49657c">and learn from failure.</text></g>
    <g><rect x="570" y="555" width="440" height="280" rx="32" fill="#07182b"/><circle cx="645" cy="630" r="40" fill="#ff9900"/><text x="645" y="642" text-anchor="middle" font-size="31" font-weight="700" fill="#07182b">04</text><text x="705" y="625" font-size="31" font-weight="700" fill="#ffffff">PERFORMANCE</text><text x="705" y="664" font-size="31" font-weight="700" fill="#ffffff">EFFICIENCY</text><text x="610" y="735" font-size="24" fill="#c8d9e8">Match resources and design</text><text x="610" y="771" font-size="24" fill="#c8d9e8">to changing demand.</text></g>
    <g><rect x="70" y="875" width="440" height="280" rx="32" fill="#07182b"/><circle cx="145" cy="950" r="40" fill="#ff9900"/><text x="145" y="962" text-anchor="middle" font-size="31" font-weight="700" fill="#07182b">05</text><text x="205" y="945" font-size="32" font-weight="700" fill="#ffffff">COST</text><text x="205" y="984" font-size="32" font-weight="700" fill="#ffffff">OPTIMIZATION</text><text x="110" y="1055" font-size="24" fill="#c8d9e8">Measure value, control waste,</text><text x="110" y="1091" font-size="24" fill="#c8d9e8">and improve unit economics.</text></g>
    <g><rect x="570" y="875" width="440" height="280" rx="32" fill="#ffffff" stroke="#c8d9e8" stroke-width="3"/><circle cx="645" cy="950" r="40" fill="#2f86b7"/><text x="645" y="962" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">06</text><text x="705" y="966" font-size="34" font-weight="700" fill="#07182b">SUSTAINABILITY</text><text x="610" y="1055" font-size="24" fill="#49657c">Reduce resource use while</text><text x="610" y="1091" font-size="24" fill="#49657c">maintaining required outcomes.</text></g>
  </g>
  <rect x="70" y="1210" width="940" height="3" fill="#d1dfe9"/>
  <text x="540" y="1270" text-anchor="middle" fill="#07182b" font-family="Arial, sans-serif" font-size="31" font-weight="700">REVIEW · PRIORITIZE · REMEDIATE · REPEAT</text>
  <text x="540" y="1315" text-anchor="middle" fill="#49657c" font-family="Arial, sans-serif" font-size="23">Use the current AWS Well-Architected Framework as the primary reference</text>
</svg>
