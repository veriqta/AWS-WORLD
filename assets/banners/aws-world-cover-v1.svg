<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">AWS World</title>
  <desc id="desc">AWS World cover with a cloud connected to architecture, security, operations, automation, data, and reliability nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182b"/><stop offset="1" stop-color="#12395b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="920" cy="120" r="230" fill="#ff9900" opacity="0.10"/>
  <circle cx="140" cy="1210" r="280" fill="#39b9ff" opacity="0.08"/>
  <text x="90" y="145" fill="#ff9900" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="5">CLOUD ENGINEERING LEARNING CENTER</text>
  <text x="90" y="275" fill="#ffffff" font-family="Arial, sans-serif" font-size="112" font-weight="700">AWS WORLD</text>
  <text x="94" y="345" fill="#c8d9e8" font-family="Arial, sans-serif" font-size="34">From cloud foundations to secure production systems</text>
  <g filter="url(#shadow)">
