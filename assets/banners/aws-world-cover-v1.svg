    <text x="540" y="775" text-anchor="middle" fill="#2879ad" font-family="Arial, sans-serif" font-size="34">BUILD · SECURE · OPERATE</text>
  </g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <g><circle cx="185" cy="1005" r="74" fill="#ff9900"/><text x="185" y="1015" fill="#07182b">ARCHITECT</text></g>
    <g><circle cx="420" cy="1005" r="74" fill="#2f86b7"/><text x="420" y="1015">SECURE</text></g>
    <g><circle cx="660" cy="1005" r="74" fill="#2f86b7"/><text x="660" y="1015">AUTOMATE</text></g>
