    <path d="M395 695c-2-81 62-147 143-147 63 0 117 40 137 97 64 0 116 48 116 108 0 60-52 108-116 108H371c-69 0-125-52-125-116 0-58 46-106 106-115 12-54 60-94 117-94" fill="#eaf6ff" stroke="#2879ad" stroke-width="9"/>
